name: iOS CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  test:
    name: Build & Run Unit Tests
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Xcode & macOS Environment
        run: |
          xcodebuild -version
          swift --version
          sw_vers

      - name: Run Swift Package Unit Tests (14 Suites)
        run: |
          swift test

      - name: Run iOS Simulator Test Suite
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | jq -r '.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | contains("iPhone")) | .udid' | head -n 1)
          if [ -n "$DEVICE_ID" ]; then
            echo "Testing on iOS Simulator ID: $DEVICE_ID"
            xcodebuild test \
              -project ExpenseTracker.xcodeproj \
              -scheme ExpenseTracker \
              -destination "id=$DEVICE_ID" \
              -derivedDataPath ./build/DerivedData \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO
          else
            echo "Falling back to default iPhone 15 simulator"
            xcodebuild test \
              -project ExpenseTracker.xcodeproj \
              -scheme ExpenseTracker \
              -destination 'platform=iOS Simulator,name=iPhone 15' \
              -derivedDataPath ./build/DerivedData \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO
          fi

      - name: Prepare Simulator App for Appetize.io
        run: |
          cd ./build/DerivedData/Build/Products/Debug-iphonesimulator
          # Remove unit test bundle to keep app standalone and lightweight
          rm -rf ExpenseTracker.app/PlugIns
          # Create explicit standalone zip
          zip -r -y ExpenseTracker-Simulator.zip ExpenseTracker.app
          ls -lh ExpenseTracker-Simulator.zip

      - name: Upload Simulator App (Appetize.io Ready)
        uses: actions/upload-artifact@v4
        with:
          name: ExpenseTracker-Simulator
          path: ./build/DerivedData/Build/Products/Debug-iphonesimulator/ExpenseTracker.app
          retention-days: 14

      - name: Upload Standalone Zip
        uses: actions/upload-artifact@v4
        with:
          name: ExpenseTracker-Simulator-Zip
          path: ./build/DerivedData/Build/Products/Debug-iphonesimulator/ExpenseTracker-Simulator.zip
          retention-days: 14
